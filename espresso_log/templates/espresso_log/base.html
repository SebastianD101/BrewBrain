{% load static %}<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BrewBrain{% endblock %} · BrewBrain</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'espresso_log/brewbrain.css' %}" rel="stylesheet">
</head>
<body>
  {% with current=request.resolver_match.url_name %}
  <nav class="navbar navbar-expand navbar-dark bb-navbar">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'shot_list' %}">☕ BrewBrain</a>
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link {% if current == 'shot_list' %}active{% endif %}"
             {% if current == 'shot_list' %}aria-current="page"{% endif %}
             href="{% url 'shot_list' %}">Shot log</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if current == 'predict' %}active{% endif %}"
             {% if current == 'predict' %}aria-current="page"{% endif %}
             href="{% url 'predict' %}">Predict &amp; dial in</a>
        </li>
      </ul>
    </div>
  </nav>
  {% endwith %}

  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
