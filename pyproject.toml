[project]
name = "brewbrain"
version = "1.0.0"
description = "Espresso shot logger that learns how your recipe affects taste and suggests how to dial in."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-q --cov=espresso_log --cov-report=term-missing"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]
